[project]
name = "danang-infra-ai"
version = "0.1.0"
description = "YOLOv8 inference service for Đà Nẵng infrastructure system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "numpy>=1.26.4",
    "pillow>=10.4.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
real = [
    "opencv-python-headless>=4.10.0.84",
    "ultralytics>=8.3.0",
]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
