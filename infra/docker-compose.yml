version: "3.9"

# ============================================================
# Đà Nẵng Public Infrastructure System — DEV Compose
# Single-command runtime: data services + apps + workers
# ============================================================

x-backend-env: &backend-env
  ENV: development
  DEBUG: "true"
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-32-chars-min}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-infra}:${POSTGRES_PASSWORD:-infra_dev_pw}@db:5432/${POSTGRES_DB:-danang_infra}
  DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-infra}:${POSTGRES_PASSWORD:-infra_dev_pw}@db:5432/${POSTGRES_DB:-danang_infra}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-danang-infra}
  S3_REGION: ${S3_REGION:-ap-southeast-1}
  MEILI_HOST: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_dev_key}
  AI_SERVICE_URL: http://ai-service:8001
  AI_USE_REAL_MODEL: ${AI_USE_REAL_MODEL:-false}
  AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.6}
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
  RATE_LIMIT_LOGIN_PER_15M: ${RATE_LIMIT_LOGIN_PER_15M:-5}
  RATE_LIMIT_REPORT_PER_HOUR: ${RATE_LIMIT_REPORT_PER_HOUR:-5}
  SMTP_HOST: mailhog
  SMTP_PORT: 1025
  EMAIL_FROM: ${EMAIL_FROM:-noreply@danang.gov.vn}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PYTHONUNBUFFERED: "1"

services:
  # ---------------- Data layer ----------------
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infra_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-danang_infra}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infra} -d ${POSTGRES_DB:-danang_infra}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-danang-infra} || true &&
      mc anonymous set download local/${S3_BUCKET:-danang-infra} || true &&
      echo 'MinIO bucket ready'
      "

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_dev_key}
      MEILI_ENV: development
    volumes:
      - meili-data:/meili_data
    ports:
      - "${MEILI_PORT:-7700}:7700"

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"

  # ---------------- App layer (hot reload) ----------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *backend-env
    volumes:
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
      - ../backend/alembic.ini:/app/alembic.ini
      - backend-cache:/root/.cache
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    volumes:
      - ../backend/app:/app/app
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-l", "info", "-Q", "default,maintenance,aqi,kpi"]

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    volumes:
      - ../backend/app:/app/app
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "-l", "info"]

  ai-service:
    build:
      context: ../ai-service
    restart: unless-stopped
    environment:
      AI_USE_REAL_MODEL: ${AI_USE_REAL_MODEL:-false}
      AI_MODEL_PATH: ${AI_MODEL_PATH:-models/yolov8n.pt}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../ai-service/app:/app/app
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-dir", "/app/app"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:-https://demotiles.maplibre.org/style.json}
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
      NEXT_PUBLIC_MAP_CENTER_LAT: ${NEXT_PUBLIC_MAP_CENTER_LAT:-16.0544}
      NEXT_PUBLIC_MAP_CENTER_LNG: ${NEXT_PUBLIC_MAP_CENTER_LNG:-108.2022}
      NEXT_PUBLIC_MAP_DEFAULT_ZOOM: ${NEXT_PUBLIC_MAP_DEFAULT_ZOOM:-12}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../frontend/app:/app/app
      - ../frontend/components:/app/components
      - ../frontend/lib:/app/lib
      - ../frontend/public:/app/public
      - ../frontend/next.config.ts:/app/next.config.ts
      - ../frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ../frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - frontend-next:/app/.next
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: ["npm", "run", "dev"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  meili-data:
  backend-cache:
  frontend-next:
  frontend-node-modules:
