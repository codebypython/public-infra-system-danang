version: "3.9"

# Production compose — front of Nginx, internal services not exposed
# Use external secrets manager in real production; this file shows topology.

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    expose: ["6379"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    expose: ["9000", "9001"]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili-data:/meili_data
    expose: ["7700"]

  ai-service:
    build: ../ai-service
    restart: unless-stopped
    environment:
      AI_USE_REAL_MODEL: "true"
    volumes:
      - ../ai-service/models:/app/models:ro
    expose: ["8001"]

  backend:
    build: ../backend
    restart: unless-stopped
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      -w ${BACKEND_WORKERS:-4}
      --access-logfile -
    env_file: ../.env.production
    depends_on: [db, redis, minio, ai-service]
    expose: ["8000"]

  worker:
    build: ../backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -l info -c 4
    env_file: ../.env.production
    depends_on: [redis, db]

  beat:
    build: ../backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat -l info
    env_file: ../.env.production
    depends_on: [redis, db]

  frontend:
    build: ../frontend
    restart: unless-stopped
    env_file: ../.env.production
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on: [backend, frontend, ai-service]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  meili-data:
