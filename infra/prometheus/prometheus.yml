global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    project: danang-infra

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8001"]
