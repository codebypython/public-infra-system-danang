name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: infra
          POSTGRES_PASSWORD: infra_dev_pw
          POSTGRES_DB: danang_infra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql+asyncpg://infra:infra_dev_pw@localhost:5432/danang_infra_test
      DATABASE_URL_SYNC: postgresql://infra:infra_dev_pw@localhost:5432/danang_infra_test
      REDIS_URL: redis://localhost:6379/0
      ENV: test
      SECRET_KEY: testkey

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e .[dev]

      - name: Ruff lint
        working-directory: backend
        run: ruff check app

      - name: Bandit security scan
        working-directory: backend
        run: bandit -r app -ll -x app/db/migrations

      - name: Pytest
        working-directory: backend
        run: pytest --cov=app --cov-report=xml -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
