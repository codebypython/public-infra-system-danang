[project]
name = "danang-infra-backend"
version = "0.1.0"
description = "FastAPI backend for Đà Nẵng public infrastructure system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "geoalchemy2>=0.15.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.3",
    "shapely>=2.0.6",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "httpx>=0.27.2",
    "redis>=5.1.1",
    "celery>=5.4.0",
    "python-socketio>=5.11.4",
    "boto3>=1.35.36",
    "meilisearch>=0.31.5",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "openpyxl>=3.1.5",
    "geojson>=3.1.0",
    "python-dateutil>=2.9.0",
    "email-validator>=2.2.0",
    "Pillow>=10.4.0",
    "h3>=4.1.0",
    "ortools>=9.10.4067",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "sentry-sdk[fastapi]>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "factory-boy>=3.3.1",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "bandit>=1.7.10",
    "testcontainers[postgres]>=4.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PT", "RET", "SIM"]
ignore = ["S101", "S104", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "tests/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
